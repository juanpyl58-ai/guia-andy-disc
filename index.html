<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>[hidden]{display:none!important}body{margin:0}img{max-width:100%}</style></head><body>
<title>Guía Andy Disc</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: una sola pantalla por paso. Encabezado fijo con progreso, contenido grande al centro, botones enormes pegados abajo para el pulgar. */
:root{
  --bg:#FFFFFF; --surface:#EEF3F9; --fg:#0F1B2D; --muted:#40506A; --line:#BFCCE0;
  --accent:#0B4F9C; --accent-ink:#FFFFFF;
  --key:#7A4300; --key-bg:#FFEFD0; --hig:#0B5C45; --hig-bg:#DDF3EA;
  --danger:#9E1F18;
  --font:'Atkinson Hyperlegible','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  --fs:24;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1622; --surface:#182439; --fg:#F2F6FC; --muted:#B6C4D8; --line:#37486A;
  --accent:#8CBFFF; --accent-ink:#07192E;
  --key:#FFC670; --key-bg:#3A2A0C; --hig:#7BDDB0; --hig-bg:#0F3326; --danger:#FF9A92; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1622; --surface:#182439; --fg:#F2F6FC; --muted:#B6C4D8; --line:#37486A;
  --accent:#8CBFFF; --accent-ink:#07192E;
  --key:#FFC670; --key-bg:#3A2A0C; --hig:#7BDDB0; --hig-bg:#0F3326; --danger:#FF9A92; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:calc(var(--fs)*1px);line-height:1.4;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
.wrap{max-width:680px;margin:0 auto}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:4px solid var(--accent);outline-offset:3px}
h1,h2{text-wrap:balance;margin:0}

/* encabezado */
.top{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding-block:12px 10px;z-index:5;border-bottom:2px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.toprow{display:flex;justify-content:space-between;gap:12px;align-items:baseline;font-size:.8em;color:var(--muted);font-weight:700}
.toprow b{color:var(--fg)}
.segs{display:flex;gap:4px;margin-top:8px}
.seg{flex:1;height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.seg i{display:block;height:100%;background:var(--accent);width:0}

/* paso */
main{padding-block:20px 300px;display:flex;flex-direction:column;gap:18px}
.pill{align-self:flex-start;font-size:.7em;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:6px 12px;border-radius:99px;background:var(--surface);color:var(--muted)}
.pill.key{background:var(--key-bg);color:var(--key)}
.pill.hig{background:var(--hig-bg);color:var(--hig)}
.num{font-size:.75em;font-weight:700;color:var(--muted)}
.stepbadge{display:inline-flex;align-items:center;gap:12px;align-self:flex-start;background:var(--accent);color:var(--accent-ink);border-radius:99px;padding:6px 22px 6px 8px;font-weight:700}
.stepbadge b{display:grid;place-items:center;width:1.9em;height:1.9em;border-radius:50%;background:var(--accent-ink);color:var(--accent);font-size:1.25em;font-variant-numeric:tabular-nums}
.stepbadge span{font-size:.9em;letter-spacing:.02em}
h1{font-size:1.9em;line-height:1.08;font-weight:700;overflow-wrap:break-word;hyphens:auto}
.detail{font-size:1.2em;line-height:1.35;margin:0;color:var(--fg)}
.box{background:var(--surface);border-radius:16px;padding:18px}
.syms{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.syms svg{width:56px;height:56px}
.bignum{font-size:3.2em;font-weight:700;line-height:1;margin-right:6px;color:var(--fg)}
.syms .lab{font-weight:700;font-size:1.1em;letter-spacing:.04em}
.hint{font-size:.9em;color:var(--muted);margin:10px 0 0}
.count{font-size:4.5em;font-weight:700;line-height:1;text-align:center;font-variant-numeric:tabular-nums;color:var(--accent)}

/* botones */
.btn{border:3px solid var(--accent);background:var(--bg);color:var(--accent);border-radius:16px;min-height:64px;padding:12px 18px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:10px;text-align:center;line-height:1.15;width:100%}
.btn.primary{background:var(--accent);color:var(--accent-ink);min-height:84px;font-size:1.2em}
.btn.soft{border-color:var(--line);color:var(--fg)}
.btn svg{width:1.2em;height:1.2em;flex:none}
.btn.danger{border-color:var(--danger);color:var(--danger)}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:2px solid var(--line);
  padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));z-index:6}
.bar .wrap{display:grid;gap:10px}
.row2big{display:grid;grid-template-columns:1fr 1.4fr;gap:10px}
.row2big .btn{min-height:76px;font-size:1em}
.row3{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.row3 .btn{min-height:62px;font-size:.68em;flex-direction:column;gap:4px;padding:8px 2px;border-radius:14px}
.row3 .btn svg{width:1.5em;height:1.5em}

/* inicio / listas */
.stack{display:grid;gap:14px}
.title-big{font-size:1.9em;line-height:1.1}
.sub{color:var(--muted);margin:0;font-size:.85em}
.list{display:grid;gap:8px;padding:0;margin:0;list-style:none}
.list button{width:100%;display:flex;gap:14px;align-items:center;text-align:left;border:2px solid var(--line);background:var(--bg);border-radius:14px;padding:12px 14px;min-height:64px}
.list .n{flex:none;width:2.2em;height:2.2em;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-weight:700;font-size:.85em;font-variant-numeric:tabular-nums}
.list .cur{border-color:var(--accent);border-width:3px}
.phase{font-size:.75em;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:10px 0 0}
.note{font-size:.72em;color:var(--muted);margin:0}

/* ayuda */
.sheet{position:fixed;inset:0;background:var(--bg);z-index:20;overflow-y:auto;
  padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet .wrap{display:grid;gap:14px}
.field{display:grid;gap:6px;font-weight:700;font-size:.85em}
input[type=tel]{font:inherit;padding:14px;border:3px solid var(--line);border-radius:12px;background:var(--bg);color:var(--fg);width:100%}
.sizes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.done{text-align:center;padding-block:40px;display:grid;gap:18px;justify-items:center}
.artbox{background:var(--surface);border-radius:18px;padding:10px;color:var(--fg)}
.art{display:block;width:100%;height:auto;max-height:34vh}
.art *{stroke:var(--fg);stroke-width:5;stroke-linecap:round;stroke-linejoin:round;fill:none}
.art .a{fill:var(--accent);stroke:var(--accent)}
.art .w{fill:var(--bg)}
.art text{fill:var(--fg);stroke:none;font:700 15px var(--font)}
.discsvg{display:block;width:100%;max-width:420px;margin:0 auto;height:auto}
.artbox:has(.discsvg){background:#fff;color:#334}
.artbox:has(.discsvg) .hint{color:#44546A}
@media (prefers-reduced-motion:no-preference){.halo{animation:pulse 1.6s ease-in-out infinite}@keyframes pulse{50%{opacity:.35}}}
.okbox,.warnbox{border-radius:16px;padding:16px;font-weight:700;margin:0}
.okbox{background:var(--hig-bg);color:var(--hig)}
.warnbox{background:var(--key-bg);color:var(--key)}
.bigv{font-size:2.2em;font-weight:700;line-height:1.1;margin:0;font-variant-numeric:tabular-nums}
.logrow{border:2px solid var(--line);border-radius:14px;padding:12px 14px;display:grid;gap:4px;font-size:.85em}
.tablewrap{overflow-x:auto;border:2px solid var(--line);border-radius:14px}
.rtab{border-collapse:collapse;width:100%;font-size:.8em;font-variant-numeric:tabular-nums}
.rtab th,.rtab td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
.rtab th{background:var(--surface);color:var(--muted);font-weight:700}
.rtab tr:last-child td{border-bottom:0}
.logrow b{font-size:1.05em}
textarea{font:inherit;font-size:.7em;width:100%;min-height:8em;padding:12px;border:2px solid var(--line);border-radius:12px;background:var(--bg);color:var(--fg)}
.photo{position:relative;max-width:380px;margin:0 auto;background:#fff;border-radius:14px;overflow:hidden}
.photo img{display:block;width:100%;height:auto}
.photo svg{position:absolute;inset:0;width:100%;height:100%}
.artbox:has(.photo){background:#fff}
.artbox:has(.photo) .hint{color:#44546A}
.rd{position:relative;max-width:360px;margin:0 auto;border-radius:14px;overflow:hidden}
.rd img{display:block;width:100%;height:auto}
.pn{position:absolute;font:700 84px/1 'Atkinson Hyperlegible',Arial,sans-serif;color:#000;text-shadow:0 0 8px #fff,0 0 8px #fff,0 0 3px #fff}
.pn-one{left:10px;top:6px}.pn-lave{right:10px;top:6px}.pn-inf{right:10px;bottom:4px}.pn-four{left:10px;top:42%}
.legend{display:grid;gap:6px;margin:10px 0 0;padding:0;list-style:none;font-size:.8em}
.legend li{display:flex;gap:10px;align-items:center}.legend svg{width:30px;height:30px;flex:none}
.homewrap{padding-block:16px 40px;display:flex;flex-direction:column;min-height:70vh}
.bigmic{width:100%;max-width:520px;margin:0 auto;aspect-ratio:1/1;max-height:62vh;border-radius:36px;border:6px solid var(--accent);background:var(--accent);color:var(--accent-ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;box-shadow:0 14px 36px rgba(11,79,156,.35);cursor:pointer;padding:16px}
.bigmic .micring{width:46%;max-width:220px;aspect-ratio:1/1;border-radius:50%;background:var(--accent-ink);color:var(--accent);display:flex;align-items:center;justify-content:center;margin-bottom:6px}
.bigmic .micring svg{width:56%;height:56%}
.bigmic b{font-size:1.5em;font-weight:700;letter-spacing:.03em;line-height:1}
.bigmic .micsub{font-size:.85em;font-weight:700;opacity:.92;text-align:center;line-height:1.1}
@media (prefers-reduced-motion:no-preference){.bigmic{animation:breathe 2.6s ease-in-out infinite}@keyframes breathe{50%{transform:scale(1.025);box-shadow:0 18px 44px rgba(11,79,156,.45)}}}
.callbtn{background:var(--hig-bg);border-color:var(--hig);color:var(--hig);text-decoration:none;font-size:.9em}
.askrow{display:grid;gap:10px}
input[type=text]{font:inherit;padding:16px;border:3px solid var(--line);border-radius:14px;background:var(--bg);color:var(--fg);width:100%}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chips .btn{min-height:56px;font-size:.75em;border-color:var(--line);color:var(--fg)}
.ans{font-size:1.1em;font-weight:700;margin:0}
.listening{background:var(--danger);border-color:var(--danger);color:var(--bg)}
@media (prefers-reduced-motion:no-preference){.seg i{transition:width .3s}}
</style>

<script>

 {t:'Preparación',d:'Antes de empezar, prepare todo. Lávese las manos con agua y jabón, como siempre. Cierre puertas y ventanas, así no entran corrientes de aire ni polvo. Saque el catéter con cuidado. Póngase el barbijo cubriendo la nariz y la boca. Limpie la mesa con alcohol al 70 %, incluidos los bordes. Mire la bolsa y ábrala, revisando lo que le enseñó su enfermera o enfermero. Y mire el taper, el envase, y ábralo.',k:'hig',tag:'Preparación'},
 {t:'Lavado de manos con técnica',d:'Ahora lávese las manos con la técnica completa, paso por paso.',k:'hig',tag:'Higiene',wash:1},
 {t:'Armar el sistema',d:'Cuelgue la bolsa y haga la prueba de hermeticidad, como le enseñaron. Coloque el organizador en el soporte. Y coloque el tapón.'},

 {t:'Conexión',d:'Póngase alcohol gel en las manos y frótelas hasta que sequen. Desenrosque el tapón del centro del sistema: amarillo si la bolsa es amarilla, verde si la bolsa es verde. Desenrosque el tapón de su catéter. Y enrosque su catéter en el centro.',k:'key',tag:'Momento clave'},
 {t:'Drenaje',d:'Abra la pinza en el punto que muestra el dibujo. Deje que el líquido salga a la bolsa de drenaje, el tiempo que le indicó su enfermera o enfermero.',k:'key',tag:'Momento clave',disc:{k:'one',cap:'Dibujo del disco con el tubo hacia abajo. Compare con el suyo.',s:['f'],lab:'',say:'un punto'},hint:'La punta azul señala el punto solo, arriba a la izquierda.'},
 {t:'Pesar la bolsa y registrar',d:'Pese la bolsa. Mire cómo es el líquido (color y aspecto) y anótelo en su registro.'},
 {t:'Lavar el sistema',d:'Gire el disco hasta los dos puntos, donde dice LAVE. Cuente hasta 5.',disc:{k:'lave',cap:'Dibujo del disco con el tubo hacia abajo. Compare con el suyo.',s:['f','f'],lab:'LAVE',say:'dos puntos, lave'},count:1,hint:'La punta azul señala los dos puntos, arriba a la derecha.'},
 {t:'Infusión',d:'Gire el disco hasta el medio pintado, en el grupo de tres símbolos abajo a la derecha. Es la posición de mitad abierto.',k:'key',tag:'Momento clave',disc:{k:'inf',cap:'Dibujo del disco con el tubo hacia abajo. Compare con el suyo.',s:['o','h','f'],lab:'INFUSIÓN',say:'el medio pintado, mitad abierto, infusión',legend:1},hint:'La punta azul va al medio pintado (mitad abierto), abajo a la derecha.'},
 {t:'Girar el disco a los cuatro puntos',d:'Gire el disco hasta los cuatro puntos.',disc:{k:'four',cap:'Dibujo del disco con el tubo hacia abajo. Compare con el suyo.',s:['f','f','f','f'],lab:'',say:'cuatro puntos'},hint:'La punta azul señala los cuatro puntos, a la izquierda.'},
 {t:'Cerrar la pinza del extensor',d:'Cierre la pinza del extensor.'},
 {t:'Desconexión',d:'Póngase alcohol gel en las manos, igual que en la conexión. Desenrosque el tapón. Desconéctese del centro, con el testigo azul, el PIN. Y enrosque su catéter en el tapón nuevo.',k:'key',tag:'Momento clave'}
];
var PHASES=[
 {n:'Preparar el lugar',a:1,b:2},{n:'Armar el sistema',a:3,b:4},
 {n:'Conectar y drenar',a:5,b:7},{n:'Lavar e infundir',a:8,b:11},{n:'Desconectar',a:12,b:12}];
var WASH=['Sáquese los anillos y las pulseras. Abra la canilla y regule el agua. Mójese las manos. Ponga jabón líquido o shampoo y haga mucha espuma en las palmas. Lave la palma con el dorso de cada mano y entre los dedos. Después palma con palma, entre los dedos. Lave los dedos en gancho de las dos manos, los pulgares y la yema de los dedos. Enjuague las manos con los dedos hacia arriba. Tome dos toallitas. Con una seque una mano: palma, dorso, dedo por dedo y la muñeca. Cierre la canilla. Con la otra toallita seque la otra mano de la misma manera.'];

/* ---------- estado ---------- */
function ld(k,d){try{var v=localStorage.getItem('andy.'+k);return v===null?d:v}catch(e){return d}}
function sv(k,v){try{localStorage.setItem('andy.'+k,v)}catch(e){}}
var S={view:'home',flow:'main',i:0,help:false,confirm:false,
  fs:+ld('fs',36),voice:ld('voice','1')==='1',phone:ld('phone',''),phoneDoc:ld('phonedoc',''),volDay:ld('volday',''),saved:+ld('i',0),back:0};
var app=document.getElementById('app'),live=document.getElementById('live');
var timer=null;

/* ---------- iconos ---------- */
var IC={
 next:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>',
 prev:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>',

 x:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>'
};
function dots(s){return s.map(function(x){return x==='f'
 ?'<svg viewBox="0 0 56 56" aria-hidden="true"><circle cx="28" cy="28" r="22" fill="currentColor"/></svg>'
 :x==='h'?'<svg viewBox="0 0 56 56" aria-hidden="true"><circle cx="28" cy="28" r="19" fill="none" stroke="currentColor" stroke-width="6"/><path d="M28 9a19 19 0 0 0 0 38z" fill="currentColor"/></svg>'
 :'<svg viewBox="0 0 56 56" aria-hidden="true"><circle cx="28" cy="28" r="19" fill="none" stroke="currentColor" stroke-width="6"/></svg>'}).join('')}

/* ---------- voz ---------- */
function speakable(t){
  return String(t).replace(/70\s?%/g,'setenta por ciento').replace(/\bPIN\b/g,'pin').replace(/\bLAVE\b/g,'lave').replace(/INFUSIÓN/g,'infusión').replace(/…/g,'.').replace(/\s+/g,' ').trim();
}
var VOICE=null;
function pickVoice(){
  try{
    var vs=speechSynthesis.getVoices().filter(function(x){return /^es/i.test(x.lang)});
    if(!vs.length)return null;
    function score(v){
      var n=(v.name+' '+v.lang),sc=0;
      if(/premium|enhanced|neural|natural|mejorada/i.test(n))sc+=50;
      if(/google|siri|microsoft/i.test(n))sc+=25;
      if(/paulina|m[oó]nica|marisol|mar[ií]a|elena|helena|sabina|dalia|elvira|salome|paloma|juan|diego|jorge|carlos|angelica/i.test(n))sc+=15;
      if(/es[-_](AR|MX|US|419|CO|CL)/i.test(v.lang))sc+=10;
      if(/compact|espeak|novelty|eloquence/i.test(n))sc-=40;
      if(v.localService===false)sc+=5;
      return sc;
    }
    vs.sort(function(a,b){return score(b)-score(a)});
    return vs[0];
  }catch(e){return null}
}
/* Lector robusto para el celular: lee en pedacitos cortos, uno tras otro (espera onend o un vigía),
   con resume() cada 5s (Android pausa la síntesis) y token de aborto. Arregla "se corta / no termina de leer". */
var TTSID=0,TTSKA=null;
function ttsKeepAlive(on){try{clearInterval(TTSKA)}catch(e){}TTSKA=null;if(on){TTSKA=setInterval(function(){try{if(speechSynthesis.speaking)speechSynthesis.resume();else{clearInterval(TTSKA);TTSKA=null}}catch(e){}},5000)}}
function ttsChunks(t){var parts=String(t).split(/(?<=[.!?:,])\s+/),out=[];parts.forEach(function(p){p=p.trim();if(!p)return;while(p.length>140){var cut=p.lastIndexOf(' ',140);if(cut<60)cut=140;out.push(p.slice(0,cut).trim());p=p.slice(cut).trim()}if(p)out.push(p)});return out}
function speakSeq(t,cb){
  try{
    if(!('speechSynthesis' in window)){cb&&cb();return}
    var myid=++TTSID;try{speechSynthesis.cancel()}catch(e){}
    if(!VOICE)VOICE=pickVoice();
    var chunks=ttsChunks(t);if(!chunks.length){cb&&cb();return}
    var done=false,i=0,wd=null;
    function finish(){if(done)return;done=true;try{clearTimeout(wd)}catch(e){}if(myid===TTSID)ttsKeepAlive(false);cb&&cb()}
    ttsKeepAlive(true);
    function next(){
      if(done)return;try{clearTimeout(wd)}catch(e){}
      if(myid!==TTSID){done=true;return}
      if(i>=chunks.length){finish();return}
      var c=chunks[i],adv=false;
      function go(){if(adv)return;adv=true;i++;next()}
      var u=new SpeechSynthesisUtterance(c);u.lang=VOICE?VOICE.lang:'es-AR';if(VOICE)u.voice=VOICE;u.rate=1.02;u.pitch=1.02;
      u.onend=go;u.onerror=go;
      wd=setTimeout(go,Math.max(2600,c.length*95)+1600);
      try{speechSynthesis.speak(u)}catch(e){go()}
    }
    next();
  }catch(e){cb&&cb()}
}
function browserSay(t){speakSeq(t,null)}
function say(t){
  t=speakable(t);stopSay();
  if(CAP.t){
    try{CAP.t.speak(t.slice(0,1900),{voice:'buttery',rate:1.06,language:'es'}).catch(function(e){if(e&&e.code!=='viewer_stopped')browserSay(t)});return}catch(e){}
  }
  browserSay(t);
}
function stopSay(){TTSID++;try{if(window.S)S.speaking=false}catch(e){}ttsKeepAlive(false);try{speechSynthesis.cancel()}catch(e){}try{if(CAP.t)CAP.t.stop()}catch(e){}}
try{if('speechSynthesis' in window)speechSynthesis.onvoiceschanged=function(){VOICE=pickVoice()}}catch(e){}
function stepText(){
  if(S.flow==='wash')return 'Lavado de manos, paso '+(S.i+1)+' de '+WASH.length+'. '+WASH[S.i];
  var p=STEPS[S.i],pre=(S.nick&&[0,4,5,8,11].indexOf(S.i)>=0)?S.nick+'. ':'';
  return pre+'Paso '+(S.i+1)+'. '+p.t+'. '+p.d+(p.disc?' Posición: '+p.disc.say+'.':'');
}
function phaseOf(n){return PHASES.filter(function(p){return n>=p.a&&n<=p.b})[0]}

function topbar(label,right,fracs){
  return '<header class="top"><div class="toprow"><span>'+label+'</span><span><b>'+right+'</b></span></div><div class="segs" aria-hidden="true">'
   +fracs.map(function(f){return '<div class="seg"><i style="width:'+Math.round(f*100)+'%"></i></div>'}).join('')+'</header>';
}

function vStep(){
  var wash=S.flow==='wash',n=S.i+1,total=wash?WASH.length:STEPS.length,p=wash?null:STEPS[S.i],ph=wash?null:phaseOf(n);
  var fr=wash?[ (n-1)/total ]:PHASES.map(function(q){return n>q.b?1:n<q.a?0:(n-q.a+1)/(q.b-q.a+1)});
  var h=topbar(wash?'Lavado de manos':ph.n,(wash?'Paso ':'Paso ')+n+' de '+total,fr);
  var m='<main>';
  if(wash){
    m+='<span class="pill hig">Higiene</span><h1>'+WASH[S.i]+'</h1>'+artBox('wash');
  }else{
    if(p.tag)m+='<span class="pill '+p.k+'">'+p.tag+'</span>';
    m+='<span class="stepbadge"><b>'+n+'</b><span>de '+STEPS.length+'</span></span><h1 id="ttl" tabindex="-1">'+p.t+'</h1>'+(p.disc?'':(PHMAP[S.i]?photoStep(PHMAP[S.i]):artBox(STEPART[S.i])))+'<p class="detail">'+p.d+'</p>';
    if(p.disc)m+='<div class="artbox">'+discSvg(p.disc.k)+'<p class="hint" style="text-align:center;margin:6px 0 0">'+p.disc.cap+'</p><button class="btn soft" data-act="replay" data-k="'+p.disc.k+'" style="margin-top:8px;min-height:52px;font-size:.8em">Ver el giro otra vez</button></div>'+discReal(p.disc.k)+'<div class="box"><div class="syms" role="img" aria-label="'+p.disc.say+'"><span class="bignum">'+DGRP[p.disc.k].n+'</span>'+dots(p.disc.s)+(p.disc.lab?'<span class="lab">'+p.disc.lab+'</span>':'')+'</div>'+(p.hint?'<p class="hint">'+p.hint+'</p>':'')+(p.disc.legend?'<ul class="legend"><li>'+dots(['o'])+'<span><b>Círculo vacío:</b> circuito cerrado</span></li><li>'+dots(['h'])+'<span><b>Medio pintado:</b> mitad abierto</span></li><li>'+dots(['f'])+'<span><b>Pintado:</b> abierto</span></li></ul>':'')+'</div>';
    if(S.i===4)m+=discPhotoBox()+connBox('none');
    if(S.i===5)m+=connBox('drain');
    if(S.i===8)m+=connBox('infuse');
    if(S.i===5)m+=reminderBox();
    if(S.i===6)m+=reminderBox()+recPanel();
    if(S.i===8&&S.vol)m+='<p class="okbox">Infunda '+fmtL(S.vol)+'.</p>';
    if(p.count)m+='<div class="box stack"><div class="count" id="cnt" aria-live="polite">&nbsp;</div><button class="btn" data-act="count">Contar conmigo hasta 5</button></div>';
    if(p.wash){
      if(S.washKnown){m+='<button class="btn soft" data-act="openwash">Ver cómo lavarse las manos</button>';}
      else{m+='<div class="box stack"><p style="margin:0;font-weight:700;font-size:1.05em">¿Querés que te recuerde cómo se lavan las manos, paso a paso?</p><button class="btn primary" data-act="washyes">Sí, recordámelo</button><button class="btn" data-act="washno">No, ya sé</button></div>';}
    }
  }
  m+='</main>';
  if(wash&&true){m=m.replace('<h1>','<h1 id="ttl" tabindex="-1">')}
  if(S.convo){
    var graphic=wash?artBox('wash'):(p.disc?('<div class="artbox">'+discSvg(p.disc.k)+'</div>'+discReal(p.disc.k)):(PHMAP[S.i]?photoStep(PHMAP[S.i]):artBox(STEPART[S.i])));
    m='<main>'+(wash?'<span class="pill hig">Higiene</span>':(p.tag?'<span class="pill '+p.k+'">'+p.tag+'</span>':''))
      +(wash?'':'<span class="stepbadge"><b>'+n+'</b><span>de '+STEPS.length+'</span></span>')
      +'<h1 id="ttl" tabindex="-1">'+(wash?WASH[S.i]:p.t)+'</h1>'+graphic+'</main>';
  }
  var last=wash?n===total:n===total;
  var nextLabel=wash?(last?'Listo, volver a la guía':'Siguiente'):(last?'Terminar':'Siguiente');
  var topbtn;
  if(S.convo){topbtn=(wash?'<p class="okbox" style="margin:0 0 4px;text-align:center">🎤 '+(S.washPaused?'En pausa. Diga «sigamos».':'Lavado guiado. Diga «pausa» para frenar.')+'</p>':'<p class="okbox" style="margin:0 0 4px;text-align:center">🎤 Manos libres. Diga «sí» para seguir.</p>')+'<button class="btn danger" data-act="convostop">Detener manos libres</button>';}
  else if(wash&&S.washAuto){topbtn=(S.washPaused?'<button class="btn primary" data-act="washresume">'+IC.next+'Reanudar lavado</button>':'<button class="btn primary" data-act="washpause">⏸ Pausar lavado</button>');}
  else{topbtn='<button class="btn primary" data-act="next">'+nextLabel+(last&&!wash?'':IC.next)+'</button>';}
  var bar;
  if(S.convo){
    bar='<div class="bar"><div class="wrap">'+topbtn
     +'<div class="row2big">'
     +'<button class="btn soft" data-act="convoback">'+IC.prev+'Atrás</button>'
     +'<button class="btn primary" data-act="convonext">Adelante'+IC.next+'</button>'
     +'</div></div></div>';
  }else{
    bar='<div class="bar"><div class="wrap">'
     +topbtn
     +phoneBtn()
     +'<div class="row3">'
     +'<button class="btn soft" data-act="prev">'+IC.prev+'Atrás</button>'
     +'<button class="btn" data-act="ask">'+IC.mic+'Preguntar</button>'
     +'<button class="btn soft" data-act="speak">'+IC.spk+'Escuchar</button>'
     +'<button class="btn" data-act="help">'+IC.help+'Ayuda</button>'
     +'</div></div></div>';
  }
  return h+m+bar;
}
function vIndex(){
  var o='<header class="top"><div class="toprow"><span>Todos los pasos</span></div></header><main style="padding-block:16px 40px"><div class="stack">'
   +'<button class="btn" data-act="home">Volver al inicio</button>';
  PHASES.forEach(function(ph){
    o+='<p class="phase">'+ph.n+'</p><ul class="list">';
    for(var n=ph.a;n<=ph.b;n++){
      o+='<li><button data-act="goto" data-n="'+(n-1)+'" class="'+(n-1===S.i&&S.view==='index'&&S.flow==='main'&&S.back?'cur':'')+'"><span class="n">'+n+'</span><span>'+STEPS[n-1].t+'</span></button></li>';
    }
    o+='</ul>';
  });

}

  var r=S.rec,sum='';

  return '<main class="done"><h1 class="title-big">Terminó el procedimiento</h1><p class="detail">Muy bien'+nn()+'. Gracias por hacerlo con tanto cuidado.</p>'+sum
   +'<button class="btn" data-act="log">Ver mi registro</button><button class="btn primary" data-act="home">Volver al inicio</button></main>';
}

/* ---------- disco real (posiciones medidas sobre las fotos del sistema) ---------- */
var DCX=120,DCY=108,DR=80;
function dpt(a,r){r=r||DR;var t=a*Math.PI/180;return [DCX+r*Math.sin(t),DCY-r*Math.cos(t)]}
function darc(a0,a1){var p=dpt(a0),q=dpt(a1);return '<path d="M'+p[0].toFixed(1)+' '+p[1].toFixed(1)+' A'+DR+' '+DR+' 0 0 1 '+q[0].toFixed(1)+' '+q[1].toFixed(1)+'" fill="none" stroke="#1F5FA8" stroke-width="7" stroke-linecap="butt"/>'}
function ddot(a,kind){var p=dpt(a),x=p[0].toFixed(1),y=p[1].toFixed(1);
  if(kind==='o')return '<circle cx="'+x+'" cy="'+y+'" r="5" fill="#fff" stroke="#1F5FA8" stroke-width="2.6"/>';
  if(kind==='h')return '<circle cx="'+x+'" cy="'+y+'" r="5.5" fill="#1F5FA8"/><path d="M'+x+' '+(p[1]-5.5).toFixed(1)+'a5.5 5.5 0 0 0 0 11z" fill="#fff" transform="rotate(35 '+x+' '+y+')"/>';
  return '<circle cx="'+x+'" cy="'+y+'" r="6" fill="#1F5FA8"/>'}
var DGRP={one:{tip:-63,from:-95,n:1,w:'punto',c:[-63],r:17},lave:{tip:60,from:-63,n:2,w:'puntos',c:[57,65],r:22},inf:{tip:136,from:60,n:3,w:'símbolos',c:[136],r:15},four:{tip:-95,from:136,n:4,w:'puntos',c:[-84,-92,-100,-107],r:30}};
function discSvg(k){
  var g=DGRP[k],mid=g.c.reduce(function(a,b){return a+b},0)/g.c.length,hp=dpt(mid);
  var o='<svg class="discsvg" viewBox="-50 0 340 236" role="img" aria-label="Disco con la perilla azul que gira hasta la posición pedida">'
   +'<path d="M120 108L36 48M120 108L204 48" stroke="#DDE3EC" stroke-width="16" stroke-linecap="round"/>'
   +'<path d="M120 190v36" stroke="#DDE3EC" stroke-width="16" stroke-linecap="round"/>'
   +'<circle cx="120" cy="108" r="96" fill="#fff" stroke="#C9D2DF" stroke-width="3"/>'
   +'<circle class="halo" cx="'+hp[0].toFixed(1)+'" cy="'+hp[1].toFixed(1)+'" r="'+g.r+'" fill="rgba(240,160,0,.28)" stroke="#E08A00" stroke-width="4"/>'
   +darc(-58,46)+darc(72,112)+darc(156,252)
   +ddot(-63)+ddot(57)+ddot(65)+ddot(-84)+ddot(-92)+ddot(-100)+ddot(-107)+ddot(123.5,'o')+ddot(136,'h')+ddot(148);
  var d=((g.tip-g.from)%360+360)%360,still=false;
  try{still=window.matchMedia('(prefers-reduced-motion: reduce)').matches}catch(e){}
  var a0=still?g.tip:g.from,a1=g.from+d;
  o+='<g transform="rotate('+a0+' 120 108)">'
   +(still?'':'<animateTransform attributeName="transform" type="rotate" from="'+g.from+' 120 108" to="'+a1+' 120 108" begin="0.7s" dur="2.4s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines=".45 0 .2 1"/>')
   +'<path d="M120 36C150 56 162 96 160 134C158 174 82 174 80 134C78 96 90 56 120 36Z" fill="#1D63B5" stroke="#124A8C" stroke-width="2"/>'
   +'<path d="M102 66C94 88 92 110 94 130" stroke="#5B9BE0" stroke-width="3" fill="none" stroke-linecap="round" opacity=".7"/><circle cx="120" cy="118" r="17" fill="#0B2A4A"/></g>';
  var np=dpt(mid,128);
  o+='<text x="'+np[0].toFixed(1)+'" y="'+np[1].toFixed(1)+'" text-anchor="middle" dy="0.35em" font-size="66" font-weight="700" fill="#000" font-family="Atkinson Hyperlegible,Arial,sans-serif">'+g.n+'</text>';

function connOverlay(flow){
  var AR='#E08A00',T='font-family:Atkinson Hyperlegible,Arial,sans-serif;font-weight:700;font-size:38px;fill:#0B1626;paint-order:stroke;stroke:#fff;stroke-width:8px';
  function head(x,y,a){return '<path d="M-24 -20L18 0L-24 20Z" fill="'+AR+'" transform="translate('+x+' '+y+') rotate('+a+')"/>'}
  function dash(d){return '<path d="'+d+'" fill="none" stroke="'+AR+'" stroke-width="12" stroke-linecap="round" stroke-dasharray="1 24"/>'}
  var o='<text x="200" y="432" text-anchor="middle" style="'+T+'">Solución nueva</text><text x="215" y="1222" text-anchor="middle" style="'+T+'">Bolsa de drenaje</text><text x="330" y="905" text-anchor="middle" style="'+T+';font-size:40px">Disco</text>';
  if(flow==='drain')o+=dash('M660 960C570 892 470 845 392 832')+head(384,831,185)+dash('M268 868C232 890 196 905 182 938')+head(180,946,95);
  if(flow==='infuse')o+=dash('M180 708C192 770 238 798 266 812')+head(272,816,28)+dash('M392 832C470 845 570 892 650 955')+head(658,962,38);
  return o;
}
var CONNCAP={none:'Así queda conectado: bolsa de solución nueva arriba, disco en el medio, bolsa de drenaje abajo.',drain:'Así sale el líquido: del abdomen, por el catéter, pasa por el disco y va a la bolsa de drenaje.',infuse:'Así entra el líquido: de la bolsa de solución nueva, por el disco y el catéter, al abdomen.'};
function connPhoto(flow){return '<div class="photo"><img src="'+IMG_CON+'" alt="Esquema de una persona con el catéter conectado al disco y a las dos bolsas"><svg viewBox="0 0 998 1402" aria-hidden="true">'+connOverlay(flow)+'</svg></div>'}

function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function norm(s){return String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim()}
function stepSay(i){var p=STEPS[i];return 'Paso '+(i+1)+': '+p.t+'. '+p.d}
function stopDict(){try{if(CAP.d&&S.listening){S.auto=false;CAP.d.stop()}}catch(e){}}
function vAsk(){
  return '<div class="sheet" role="dialog" aria-modal="true" aria-label="Preguntar"><div class="wrap">'
   +'<button class="btn primary" data-act="closeask">'+IC.x+'Cerrar y seguir</button>'
   +'<h2 style="font-size:1.3em">Pregunte lo que necesite</h2>'
   +'<p class="sub">Escriba su pregunta o dígala. También puede decir «siguiente», «atrás» o «repetir».</p>'
   +'<button class="btn micb" data-act="mic" data-t="q" '+(CAP.d?'':'hidden')+'>'+IC.mic+'Hablar</button>'
   +'<div class="askrow"><input id="q" type="text" autocomplete="off" placeholder="Escriba aquí su pregunta"><button class="btn primary" data-act="sendq">Preguntar</button></div>'
   +'<p class="note micnote" '+(CAP.d?'hidden':'')+'>Para hablar, toque el micrófono del teclado de su teléfono.</p>'
   +'<div class="chips"><button class="btn" data-act="chip" data-q="¿Qué hago ahora?">¿Qué hago ahora?</button><button class="btn" data-act="chip" data-q="¿Qué sigue después?">¿Qué sigue?</button><button class="btn" data-act="chip" data-q="¿En qué paso estoy?">¿En qué paso estoy?</button><button class="btn" data-act="chip" data-q="No entiendo, repítalo">No entiendo</button></div>'
   +'<div id="askout" aria-live="polite"></div></div></div>';
}
function paintAsk(){
  var o=document.getElementById('askout');if(!o)return;var a=S.ans;
  if(!a){o.innerHTML='';return}
  o.innerHTML='<div class="box stack"><p class="num" style="margin:0">Usted preguntó</p><p style="margin:0">'+esc(a.q)+'</p><p class="num" style="margin:0">Respuesta</p><p class="ans">'+esc(a.t)+'</p>'
   +(a.n!=null?'<button class="btn" data-act="gotoans" data-n="'+a.n+'">Ir al paso '+(a.n+1)+'</button>':'')
   +(a.busy?'':'<button class="btn soft" data-act="repeatans">'+IC.spk+'Escuchar otra vez</button>')+'</div>';
}
function setMic(){
  var bs=document.querySelectorAll('.micb');
  for(var i=0;i<bs.length;i++){var b=bs[i];
    b.hidden=!CAP.d;b.className='btn micb'+(S.listening&&b.dataset.t===S.mt.id?' listening':'');
    b.innerHTML=IC.mic+(S.listening&&b.dataset.t===S.mt.id?'Escuchando… toque para terminar':'Hablar');}
  var ns=document.querySelectorAll('.micnote');for(var j=0;j<ns.length;j++)ns[j].hidden=!!CAP.d;
}
var MICCB={nq:function(v){submitName(v)},q:function(v){askQ(v)},dq:function(v){submitDrain(v)},vq:function(v){submitVol(v)},wq:function(v){}};
function toggleMic(t){
  if(!CAP.d)return;
  if(S.listening){CAP.d.stop().catch(function(){});return}
  S.mt={id:t||'q',cb:MICCB[t||'q']};
  var q=document.getElementById(S.mt.id);S.base=q?q.value.trim():'';S.auto=true;stopSay();
  CAP.d.start().catch(function(e){S.auto=false;var n=document.querySelector('.micnote');if(n){n.hidden=false;n.textContent='No se pudo usar el micrófono. Escriba la respuesta o use el micrófono del teclado.'}});
}
function hookDict(d){
  d.onPartial(function(r){if(S.convo)return;var q=document.getElementById(S.mt.id);if(q)q.value=(S.base+' '+r.text).trim()});
  d.onFinal(function(r){if(S.convo){convoHeard(r.text);return}S.base=(S.base+' '+r.text).trim();var q=document.getElementById(S.mt.id);if(q)q.value=S.base});
  d.onState(function(r){
    S.listening=(r.state==='listening');setMic();
    if(S.convo){if(r.state==='idle')setTimeout(convoOnRecEnd,350);return}
    if(r.state==='idle'&&S.auto){S.auto=false;var q=document.getElementById(S.mt.id);if(q&&q.value.trim()&&S.mt.cb)S.mt.cb(q.value)}
  });
  if(d.onError)d.onError(function(err){
    if(err==='no-speech'||err==='aborted')return; /* transitorio: silencio; se reintenta solo */
    if(S.convo)convoStop();

function makeBrowserDict(){
  var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR)return null;
  var rec;try{rec=new SR()}catch(e){return null}
  var LANGS=['es-AR','es-ES','es-US','es-419','es'],li=0;
  rec.lang=LANGS[0];rec.continuous=false;rec.interimResults=true;rec.maxAlternatives=1;
  var pcb=null,fcb=null,scb=null,ecb=null,on=false;
  rec.onresult=function(e){var interim='',fin='';for(var i=e.resultIndex;i<e.results.length;i++){var r=e.results[i];if(r.isFinal)fin+=r[0].transcript;else interim+=r[0].transcript}if(interim&&pcb)pcb({text:interim});if(fin&&fcb)fcb({text:fin})};
  rec.onstart=function(){on=true;if(scb)scb({state:'listening'})};
  rec.onend=function(){on=false;if(scb)scb({state:'idle'})};
  rec.onerror=function(e){on=false;var err=e&&e.error||'error';
    if(err==='language-not-supported'&&li<LANGS.length-1){li++;try{rec.lang=LANGS[li]}catch(_){}return;}
    if(ecb)ecb(err);};
  return {onPartial:function(c){pcb=c},onFinal:function(c){fcb=c},onState:function(c){scb=c},onError:function(c){ecb=c},
    isOn:function(){return on},
    start:function(){if(on)return Promise.resolve();try{rec.start();return Promise.resolve()}catch(e){if(e&&e.name==='InvalidStateError'){on=true;return Promise.resolve()}return Promise.reject(e)}},
    stop:function(){try{rec.stop()}catch(e){}return Promise.resolve()}};
}

var NW={cero:0,un:1,uno:1,una:1,dos:2,tres:3,cuatro:4,cinco:5,seis:6,siete:7,ocho:8,nueve:9,diez:10,once:11,doce:12,trece:13,catorce:14,quince:15,dieciseis:16,diecisiete:17,dieciocho:18,diecinueve:19,veinte:20,veintiuno:21,veintidos:22,veintitres:23,veinticuatro:24,veinticinco:25,veintiseis:26,veintisiete:27,veintiocho:28,veintinueve:29,treinta:30,cuarenta:40,cincuenta:50,sesenta:60,setenta:70,ochenta:80,noventa:90,cien:100,ciento:100,doscientos:200,trescientos:300,cuatrocientos:400,quinientos:500,seiscientos:600,setecientos:700,ochocientos:800,novecientos:900,mil:1000};
function wordsToNum(g){var tot=0,cur=0;g.forEach(function(w){var v=NW[w];if(v===undefined)return;if(v===1000){cur=(cur||1)*1000;tot+=cur;cur=0}else cur+=v});return tot+cur}
function parseVol(s){
  var t=norm(String(s).replace(/(\d)\s*[,.]\s*(\d)/g,'$1p$2')).replace(/(\d)p(\d)/g,'$1.$2');
  t=t.replace(/\b(\d+)\s+(?:coma|punto)\s+(\d+)\b/g,'$1.$2');
  var tk=t.split(' '),out=[],i=0;
  while(i<tk.length){var w=tk[i];
    if(NW[w]!==undefined){var g=[w],j=i+1;
      while(j<tk.length&&(NW[tk[j]]!==undefined||((tk[j]==='y'||tk[j]==='con')&&j+1<tk.length&&NW[tk[j+1]]!==undefined))){if(tk[j]!=='y'&&tk[j]!=='con')g.push(tk[j]);j++}
      out.push(String(wordsToNum(g)));i=j}
    else if(w==='medio'||w==='media'){out.push('0.5');i++}
    else{out.push(w);i++}}
  t=out.join(' ').replace(/\b(\d+)\s+(?:coma|punto)\s+(\d+)\b/g,'$1.$2');
  if(!/\d\s*(l|lt|lts|litros?)\b/.test(t)&&/\blitros?\b/.test(t))t=t.replace(/\blitros?\b/,'1 litro');
  var m,ml=null;
  if(m=t.match(/(\d+(?:\.\d+)?)\s*(?:l|lt|lts|litros?)\b/)){
    ml=+m[1]*1000;var rest=t.slice(m.index+m[0].length),r=rest.match(/^\s*(?:y\s*|con\s*)?(\d+(?:\.\d+)?)/);
    if(r){var rs=r[1],x=+rs;if(/\./.test(rs))ml+=x*1000;else if(x>=10&&x<1000)ml+=x;else if(x<10)ml+=x*100}
  }else if(m=t.match(/(\d+(?:\.\d+)?)\s*(?:ml|mililitros?|cc|cm3|cent[ií]metros)\b/))ml=+m[1];
  else if(m=t.match(/(\d+(?:\.\d+)?)/)){var y=+m[1];if(y<10)ml=y*1000;else if(y>=100)ml=y}
  if(ml===null||!isFinite(ml))return null;ml=Math.round(ml);
  return ml>=50&&ml<=8000?ml:null;
}

  var wd=weightDays();
  var wRows=wd.map(function(k){var w=S.weights[k];var dif=(w.antes!=null&&w.despues!=null)?(Math.round((w.despues-w.antes)*10)/10):null;
    return '<tr><td>'+dayLabel(k)+'</td><td>'+(w.antes!=null?fmtKg(w.antes)+(w.antesA?' ~':''):'—')+'</td><td>'+(w.despues!=null?fmtKg(w.despues)+(w.despuesA?' ~':''):'—')+'</td><td>'+(dif!=null?((dif>=0?'+':'')+(''+dif).replace('.',',')+' kg'):'—')+'</td></tr>';
  }).join('');
  var today=new Date().toDateString(),ti=0,to=0,tn=0;
  S.log.forEach(function(e){if(new Date(e.id).toDateString()===today&&e.done&&e.plan){ti+=e.plan;to+=e.out;tn++}});
  var o='<header class="top"><div class="toprow"><span>Mi registro</span></div></header><main style="padding-block:16px 40px"><div class="stack">'
   +'<button class="btn" data-act="'+(S.convo?'closephones':'home')+'">'+IC.prev+'Volver</button>'
   +'<button class="btn soft" data-act="weighnow">⚖️ Anotar mi peso ahora</button>'
   +(tn?'<div class="box"><p class="num" style="margin:0">Hoy ('+tn+' '+(tn===1?'cambio':'cambios')+')</p><p style="margin:4px 0 0;font-weight:700">Infundió '+fmtL(ti)+' · Sacó '+fmtL(to)+'</p><p style="margin:4px 0 0">Balance del día: <b>'+(to-ti>=0?'+':'')+(to-ti)+' mL</b></p></div>':'');
  if(exRows){o+='<p class="phase">Cambios</p><div class="tablewrap"><table class="rtab"><thead><tr><th>Fecha</th><th>Infusión</th><th>Sacó</th><th>Balance mL</th><th>Líquido</th></tr></thead><tbody>'+exRows+'</tbody></table></div>';}
  if(wRows){o+='<p class="phase">Peso (kg) · ~ es aproximado</p><div class="tablewrap"><table class="rtab"><thead><tr><th>Fecha</th><th>Antes</th><th>Después</th><th>Diferencia</th></tr></thead><tbody>'+wRows+'</tbody></table></div>';}
  if(!exRows&&!wRows)o+='<p class="sub">Todavía no hay registros. Se anotan solos cuando, en manos libres, usted dice cuánto líquido sacó o su peso.</p>';
  if(S.log.length||wd.length)o+='<button class="btn" data-act="logcopy">Copiar para mandar a mi enfermera o enfermero</button><textarea id="logtxt" readonly>'+esc(logText())+'</textarea><p class="note" id="copymsg" aria-live="polite"></p>'
     +'<button class="btn '+(S.logConfirm?'danger':'soft')+'" data-act="logclear">'+(S.logConfirm?'Sí, borrar todo el registro':'Borrar el registro')+'</button>';
  o+='<p class="note">El registro queda guardado solo en este teléfono. Si borra los datos del navegador, se pierde.</p></div></main>';
  return o;
}

/* ---------- nombre ---------- */
function cleanName(t){
  var x=String(t).replace(/^\s*(hola[, ]*)?(me llamo|mi nombre es|soy|me dicen|ll[aá]mame|ll[aá]meme)\s+/i,'').replace(/[^A-Za-zÁÉÍÓÚÜÑáéíóúüñ' -]/g,' ').trim().split(/\s+/)[0]||'';
  return x?x.charAt(0).toUpperCase()+x.slice(1).toLowerCase():'';
}
function nickOptions(n){
  var o=[n];
  if(n.length>=7){var a=n.slice(0,Math.ceil(n.length*0.7));if(o.indexOf(a)<0)o.push(a)}
  if(n.length>=6){var b=n.slice(0,3);if(o.indexOf(b)<0)o.push(b)}
  return o;
}
function nn(){return S.nick?', '+S.nick:''}
function vName(){
  var o='<main style="padding-block:28px 40px"><div class="stack">';
  if(!S.nm){
    o+='<h1 class="title-big" style="font-size:1.7em">Bienvenido. ¿Cómo se llama?</h1><p class="sub">Así la guía le habla por su nombre.</p>'
     +'<button class="btn micb" data-act="mic" data-t="nq" '+(CAP.d?'':'hidden')+'>'+IC.mic+'Hablar</button>'
     +'<div class="askrow"><input id="nq" type="text" autocomplete="off" placeholder="Escriba su nombre"><button class="btn primary" data-act="nsend">Aceptar</button></div>'
     +'<p class="note micnote" '+(CAP.d?'hidden':'')+'>Para hablar, toque el micrófono del teclado de su teléfono.</p>'
     +(S.nerr?'<p class="warnbox">'+S.nerr+'</p>':'')
     +(S.nick?'<button class="btn soft" data-act="home">Dejar como está: '+esc(S.nick)+'</button>':'');
  }else{
    o+='<h1 class="title-big" style="font-size:1.6em">Mucho gusto, '+esc(S.nm)+'.</h1><p class="sub">¿Cómo le gusta que le llamen?</p>'
     +'<div class="stack">'+nickOptions(S.nm).map(function(x){return '<button class="btn primary" data-act="npick" data-n="'+esc(x)+'">'+esc(x)+'</button>'}).join('')+'</div>'
     +'<p class="sub">O escriba otro nombre:</p>'
     +'<div class="askrow"><input id="nq2" type="text" autocomplete="off" placeholder="Otro nombre o apodo"><button class="btn" data-act="npick2">Usar este</button></div>'
     +'<button class="btn soft" data-act="nback">Volver</button>';
  }
  return o+'</div></main>';
}
function submitName(txt){
  var n=cleanName(txt);
  if(n.length<2){S.nerr='No entendí el nombre. Escríbalo, por favor.';S.nm='';render();return}
  S.nerr='';S.nm=n;render();say('Mucho gusto, '+n+'. ¿Cómo le gusta que le llamen?');
}
function pickNick(n){
  n=cleanName(n);if(!n)return;
  S.nick=n;sv('nick',n);S.nm='';S.nerr='';S.view='home';render();window.scrollTo(0,0);
  say('Hola, '+n+'. Cuando quiera, toque Empezar.');
}

/* ---------- render ---------- */
function render(){
  document.documentElement.style.setProperty('--fs',S.fs);
  var h;
  if(S.view==='name')h=vName();else if(S.view==='home')h=vHome();else if(S.view==='vol')h=vVol();else if(S.view==='log')h=vLog();else if(S.view==='phones')h=vPhones();else if(S.view==='weigh')h=vWeigh();else if(S.view==='index')h=vIndex();else if(S.view==='done')h=vDone();else h=vStep();
  if(S.help)h+=vHelp();
  if(S.ask){h+=vAsk()}
  app.innerHTML=h;
  if(S.view==='step'&&!S.help){var t=document.getElementById('ttl');if(t)t.focus({preventScroll:true})}
  var ph=document.getElementById('phone');
  if(ph)ph.addEventListener('input',function(){S.phone=ph.value;sv('phone',ph.value)});
  var phd=document.getElementById('phonedoc');if(phd)phd.addEventListener('input',function(){S.phoneDoc=phd.value;sv('phonedoc',phd.value)});
  if(S.view==='home'&&!S.ask&&!S.help&&!S._greeted){S._greeted=1;setTimeout(greet,500)}
}
function greet(){try{say((S.nick?S.nick+'. ':'Hola. ')+'Toque el botón grande del micrófono para empezar.')}catch(e){}}
function announce(){live.textContent=stepText()}
function go(i,flow){
  stopCount();S.i=i;S.flow=flow||S.flow;S.view='step';S.help=false;S.ask=false;S.confirm=false;S.dpend=null;S.derr='';if(i!==6)S.nag=false;
  if(S.flow==='main')sv('i',i),S.saved=i;
  render();window.scrollTo(0,0);announce();if(S.voice&&!S.convo&&!S.washAuto)say(stepText());wake();
}
function stopCount(){if(timer){clearInterval(timer);timer=null}}
var WORDS=['uno','dos','tres','cuatro','cinco'];
function count(){
  stopCount();var c=document.getElementById('cnt'),k=0;if(!c)return;
  function tick(){k++;c.textContent=k;say(WORDS[k-1]);if(k>=5){stopCount()}}
  c.textContent='';tick();timer=setInterval(tick,1000);
}
var lock=null;
function wake(){try{if(navigator.wakeLock&&!lock)navigator.wakeLock.request('screen').then(function(l){lock=l;l.addEventListener('release',function(){lock=null})}).catch(function(){})}catch(e){}}
document.addEventListener('visibilitychange',function(){if(!document.hidden&&S.view==='step')wake()});

/* ---------- acciones ---------- */
app.addEventListener('click',function(e){
  var b=e.target.closest('[data-act]');if(!b)return;var a=b.dataset.act;
  if(a!=='restart')S.confirm=false;
  switch(a){
    case 'start':S.vpend=null;S.verr='';S.volPick=!S.vol;S.view='vol';render();window.scrollTo(0,0);say('¿Cuántos litros va a infundir?');break;
    case 'nsend':submitName(document.getElementById('nq').value);break;
    case 'npick':pickNick(b.dataset.n);break;
    case 'npick2':pickNick(document.getElementById('nq2').value);break;
    case 'nback':S.nm='';render();break;
    case 'rename':S.nm='';S.nerr='';S.view='name';render();window.scrollTo(0,0);break;
    case 'vsame':startExchange(S.vol);break;
    case 'volpick':S.volPick=true;render();break;
    case 'vchip':submitVol(String(b.dataset.ml)+' mililitros');break;
    case 'vsend':submitVol(document.getElementById('vq').value);break;
    case 'vyes':startExchange(S.vpend);break;
    case 'vno':S.vpend=null;S.volPick=true;render();break;
    case 'dsend':submitDrain(document.getElementById('dq').value);break;
    case 'dyes':confirmDrain();break;
    case 'dno':S.dpend=null;render();break;
    case 'dfix':if(S.rec){S.rec.drained=null;S.dpend=null}render();break;
    case 'asp':if(S.rec){S.rec.asp=(S.rec.asp===b.dataset.a?'':b.dataset.a);recSave();render();if(S.rec.asp==='t'||S.rec.asp==='s')say('Líquido '+ASP[S.rec.asp].toLowerCase()+'. Avise a su enfermera o enfermero antes de seguir.')}break;
    case 'skiprec':S.skip=true;S.nag=false;go(S.i+1,'main');break;
    case 'phones':if(S.convo){openPhones(false)}else{stopSay();S.prevView='home';S.view='phones';render();window.scrollTo(0,0)}break;
    case 'closephones':S.view=(S.prevView==='step'?'step':'home');render();window.scrollTo(0,0);if(S.convo)convoStep();break;
    case 'log':stopSay();S.view='log';S.logConfirm=false;render();window.scrollTo(0,0);break;
    case 'weighnow':S.werr='';S.view='weigh';render();window.scrollTo(0,0);break;
    case 'wsaveA':saveWeighFromInput('antes');break;
    case 'wsaveD':saveWeighFromInput('despues');break;
    case 'logcopy':
      var tx=document.getElementById('logtxt'),cm=document.getElementById('copymsg');
      try{navigator.clipboard.writeText(tx.value).then(function(){if(cm)cm.textContent='Copiado. Péguelo en un mensaje.'},function(){tx.select();if(cm)cm.textContent='Seleccionado. Use Copiar de su teléfono.'})}catch(err){tx.select();if(cm)cm.textContent='Seleccionado. Use Copiar de su teléfono.'}
      break;
    case 'logclear':if(!S.logConfirm){S.logConfirm=true;render()}else{S.log=[];S.weights={};try{sv('weights','{}')}catch(e){}logSave();S.logConfirm=false;render()}break;
    case 'resume':go(S.saved,'main');break;
    case 'convostart':S.convo=true;if(S.view!=='step'){go(0,'main')}convoStart();break;
    case 'convostop':convoStop();break;
    case 'convonext':if(Date.now()-(S._nav||0)<450)break;S._nav=Date.now();S.volAsk=false;S.aspAsk=false;S.volInAsk=false;S.washAsk=false;S.weighAsk=false;clearTimeout(S.washTimer);S.heard=true;if(S.flow==='wash'){S.washPaused=false;convoWashNext()}else{convoNext()}break;
    case 'convoback':if(Date.now()-(S._nav||0)<450)break;S._nav=Date.now();S.volAsk=false;S.aspAsk=false;S.volInAsk=false;S.washAsk=false;S.weighAsk=false;clearTimeout(S.washTimer);S.heard=true;S.washPaused=false;if(S.i>0){S.i--;render();convoStep()}else convoStep();break;
    case 'next':
      if(Date.now()-(S._nav||0)<450)break;S._nav=Date.now();
      if(S.flow==='wash'){ clearTimeout(S.washTimer);if(S.i>=WASH.length-1){washEnd()}else{go(S.i+1,'wash');if(S.washAuto&&!S.convo)washPlay()} }
      else if(S.i===6&&!(S.rec&&S.rec.drained!=null)&&!S.skip){S.nag=true;render();say('Falta anotar cuánto líquido sacó.')}
      else if(S.i>=STEPS.length-1){stopCount();stopSay();sv('i',0);S.saved=0;if(S.rec){S.rec.done=true;recSave()}S.view='done';render();window.scrollTo(0,0)}
      else go(S.i+1,'main');
      break;
    case 'prev':
      if(S.flow==='wash'){ clearTimeout(S.washTimer);if(S.i===0)washEnd();else{go(S.i-1,'wash');if(S.washAuto&&!S.convo)washPlay()} }
      else if(S.i>0)go(S.i-1,'main'); else{stopCount();S.view='home';render()}
      break;
    case 'speak':case 'speak2':if(S.convo){convoStep();}else say(S.flow==='wash'?WASH[S.i]:stepText());break;
    case 'help':if(S.convo)convoStop();S.help=true;render();break;
    case 'closehelp':S.help=false;render();break;
    case 'index':if(S.convo)convoStop();S.help=false;S.back=1;stopCount();S.view='index';render();window.scrollTo(0,0);break;
    case 'goto':S.back=0;go(+b.dataset.n,'main');break;
    case 'home':if(S.convo)convoStop();stopCount();stopSay();S.help=false;S.view='home';render();window.scrollTo(0,0);break;
    case 'openwash':washStartAuto(S.flow==='main'?S.i:S.back);break;
    case 'washonly':washStartAuto(0);break;
    case 'washyes':washStartAuto(S.i);break;
    case 'washno':S.washKnown=true;sv('washknown','1');render();if(S.i>=STEPS.length-1){S.view='done'}else go(S.i+1,'main');break;
    case 'washpause':S.washPaused=true;clearTimeout(S.washTimer);stopSay();render();break;
    case 'washresume':S.washPaused=false;render();washPlay();break;
    case 'count':count();break;
    case 'ask':if(S.convo)convoStop();S.help=false;S.ask=true;S.ans=null;render();break;
    case 'closeask':stopDict();S.ask=false;render();break;
    case 'sendq':askQ(document.getElementById('q').value);break;
    case 'chip':document.getElementById('q').value=b.dataset.q;askQ(b.dataset.q);break;
    case 'mic':toggleMic(b.dataset.t);break;
    case 'gotoans':S.back=0;go(+b.dataset.n,'main');break;
    case 'repeatans':if(S.ans)say(S.ans.t);break;
    case 'replay':var sv0=document.querySelector('.discsvg');if(sv0)sv0.outerHTML=discSvg(b.dataset.k);break;
    case 'fsp':S.fs=Math.min(56,S.fs+3);sv('fs',S.fs);render();break;
    case 'fsm':S.fs=Math.max(24,S.fs-3);sv('fs',S.fs);render();break;
    case 'voice':S.voice=!S.voice;sv('voice',S.voice?'1':'0');if(!S.voice)stopSay();render();break;
    case 'restart':
      if(!S.confirm){S.confirm=true;render()}
      else{S.confirm=false;sv('i',0);S.saved=0;S.back=0;S.rec=null;S.skip=false;S.nag=false;go(0,'main')}
      break;
  }
});
document.addEventListener('keydown',function(e){
  if(S.view!=='step'||S.help||S.ask)return;
  if(/INPUT|TEXTAREA/.test((e.target||{}).tagName||''))return;
  if(e.key==='ArrowRight')app.querySelector('[data-act=next]').click();
  if(e.key==='ArrowLeft')app.querySelector('[data-act=prev]').click();
});
app.addEventListener('keydown',function(e){if(e.key!=='Enter')return;var id=e.target.id;if(id==='nq'){e.preventDefault();submitName(e.target.value)}else if(id==='nq2'){e.preventDefault();pickNick(e.target.value)}else if(id==='q'){e.preventDefault();askQ(e.target.value)}else if(id==='dq'){e.preventDefault();submitDrain(e.target.value)}else if(id==='vq'){e.preventDefault();submitVol(e.target.value)}else if(id==='wq'){e.preventDefault();saveWeighFromInput('antes')}});
initCaps();
render();
</script>

</body></html>
